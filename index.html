<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明朝官场实录 · 陆秉文三十回合</title>
<style>
:root{--paper:#f2ecdf;--paper2:#fbf7ee;--ink:#2b2419;--ink2:#6b5f4a;--border:#c9b895;--red:#8b2e2e;--gold:#a8813a;--green:#4a6b4a;--shadow:0 2px 12px rgba(60,45,20,.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;background:var(--paper);color:var(--ink);line-height:1.9;background-image:radial-gradient(circle at 18% 12%,rgba(168,129,58,.05),transparent 55%),radial-gradient(circle at 82% 78%,rgba(139,46,46,.04),transparent 55%);min-height:100vh;padding-bottom:60px;}
.app{max-width:920px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 18px;margin:12px 0 0;border:1px solid var(--border);border-radius:6px;background:linear-gradient(180deg,#fbf7ee,#f4ecdd);box-shadow:var(--shadow);}
.title{font-size:16px;font-weight:700;letter-spacing:3px;color:var(--red)}
.title small{font-size:11px;letter-spacing:1px;color:var(--ink2);margin-left:8px;font-weight:400}
.hud{font-size:11.5px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.hud b{color:var(--red)}
.hud .g{color:var(--green)}.hud .r{color:var(--red)}
.story{margin-top:12px;background:var(--paper2);border:1px solid var(--border);border-radius:6px;padding:28px 34px;box-shadow:var(--shadow);min-height:420px;}
@media(max-width:600px){.story{padding:18px 16px}}
.date-bar{font-size:12.5px;letter-spacing:2px;color:var(--gold);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;}
.date-bar .office{color:var(--red);font-weight:700;letter-spacing:1px}
.scene-title{font-size:18px;letter-spacing:3px;color:var(--red);font-weight:700;margin-bottom:14px;padding-bottom:9px;border-bottom:1px dashed var(--border);}
.text{font-size:15px;line-height:2.1}
.text p{margin-bottom:12px}
.text .dim{color:var(--ink2);font-size:13.5px}
.text .hl{color:var(--red);font-weight:700}
.text .gold{color:var(--gold);font-weight:700}
.dialogue{margin:14px 0;padding:10px 16px;border-left:3px solid var(--gold);background:rgba(201,184,149,.14);border-radius:0 5px 5px 0;}
.dialogue .speaker{display:block;font-size:12.5px;letter-spacing:2px;color:var(--gold);font-weight:700;margin-bottom:4px;}
.dialogue .line{font-size:14.5px;line-height:2}
.inner-voice{margin:12px 0;padding:9px 14px;border-left:3px solid var(--ink2);background:rgba(107,95,74,.08);border-radius:0 5px 5px 0;font-size:13.5px;color:var(--ink2);font-style:italic;}
.roll-box{text-align:center;padding:20px;margin:16px 0;background:linear-gradient(180deg,#fdfaf3,#f2e8d4);border:2px solid var(--border);border-radius:8px;}
.roll-box .face{font-size:52px;font-weight:700;letter-spacing:8px;line-height:1.1;margin-bottom:8px;}
.roll-box .verdict{font-size:13.5px;color:var(--ink2);letter-spacing:2px;}
.f-de{color:var(--gold)}.f-cai{color:var(--green)}.f-gong{color:#3a6ea5}.f-zang{color:var(--red)}
.options{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
.opt{font-family:inherit;font-size:14.5px;text-align:left;padding:14px 18px 14px 42px;background:linear-gradient(180deg,#fdfaf3,#f1e8d6);border:1px solid var(--border);border-radius:6px;color:var(--ink);cursor:pointer;transition:.18s;position:relative;line-height:1.7;}
.opt::before{content:"▸";position:absolute;left:16px;top:15px;color:var(--gold);transition:.18s;font-size:13px;}
.opt:hover{background:linear-gradient(180deg,#fffdf7,#f7efdf);border-color:var(--gold);transform:translateX(4px);box-shadow:0 4px 14px rgba(168,129,58,.2);}
.opt:hover::before{color:var(--red);left:20px}
.opt .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:3px;margin-bottom:3px;margin-right:5px;letter-spacing:1px;}
.t-wen{background:rgba(74,107,74,.18);color:var(--green);border:1px solid rgba(74,107,74,.35)}
.t-xian{background:rgba(139,46,46,.14);color:var(--red);border:1px solid rgba(139,46,46,.3)}
.t-tan{background:rgba(168,129,58,.16);color:var(--gold);border:1px solid rgba(168,129,58,.35)}
.t-ju{background:rgba(107,95,74,.12);color:var(--ink2);border:1px solid rgba(107,95,74,.3)}
.opt .sub{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.7}
.ending{margin-top:16px;text-align:center;padding:20px 0}
.ending .mark{font-size:12px;letter-spacing:8px;color:var(--gold);margin-bottom:8px}
.ending h1{font-size:26px;letter-spacing:5px;color:var(--red);margin-bottom:14px}
.ending .desc{max-width:620px;margin:0 auto 20px;text-align:left;font-size:14.5px;line-height:2.1}
.ending .summary{max-width:620px;margin:0 auto;background:linear-gradient(180deg,#fffdf7,#f6efe0);border:1px solid var(--border);border-radius:8px;padding:16px 20px;text-align:left;font-size:13.5px;color:var(--ink2);line-height:2}
.ending .summary b{color:var(--red)}
.ending .stats{max-width:620px;margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12.5px;color:var(--ink2);text-align:center}
.ending .stats span{background:rgba(201,184,149,.2);border:1px solid var(--border);border-radius:5px;padding:7px 3px}
.ending .stats b{display:block;font-size:16px;color:var(--red);margin-top:2px}
.btn-restart{font-family:inherit;font-size:14.5px;letter-spacing:5px;padding:11px 40px;margin-top:24px;background:linear-gradient(180deg,#9c3838,#7a2626);color:#fdf8ec;border:1px solid #6a2020;border-radius:5px;cursor:pointer;transition:.2s;box-shadow:0 3px 10px rgba(139,46,46,.28);}
.btn-restart:hover{background:linear-gradient(180deg,#b04a4a,#8b2e2e);transform:translateY(-2px)}
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.log-toggle{position:fixed;right:14px;bottom:14px;width:42px;height:42px;border-radius:50%;background:var(--red);color:#fdf8ec;border:none;cursor:pointer;font-size:17px;box-shadow:0 3px 12px rgba(139,46,46,.35);z-index:100;}
.log-panel{position:fixed;right:14px;bottom:64px;width:280px;max-height:360px;overflow-y:auto;background:var(--paper2);border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:0 8px 24px rgba(60,45,20,.18);z-index:99;display:none;}
.log-panel.show{display:block}
.log-panel h4{font-size:11.5px;letter-spacing:3px;color:var(--red);margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:5px}
.log-item{font-size:11.5px;color:var(--ink2);padding:4px 0;border-bottom:1px dotted #ddd2ba;line-height:1.6}
.log-item:last-child{border-bottom:none}
.log-item .ly{color:var(--gold);font-weight:700;margin-right:4px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">明朝官场实录<small>陆秉文 · 三十回合</small></div>
    <div class="hud" id="hud"></div>
  </div>
  <div class="story fade" id="story"></div>
</div>
<button class="log-toggle" id="logBtn">📜</button>
<div class="log-panel" id="logPanel"><h4>履历记事</h4><div id="logList"></div></div>

<script>
/* ============================================================
   状态 —— 严格按文档初始值
   ============================================================ */
const G = {
  turn:1,
  文才:65, 谋略:72, 交际:78, 体质:58, 魅力:70, 运气:55,
  政绩:0, 银钱:350, 人脉:0,
  严党:0, 徐党:0, 清流:0,
  office:null, officeStartTurn:0,
  examTitle:'秀才',
  km:{德:0,才:0,功:0,赃:0},
  married:false, spouseType:null,
  outerPostCount:0,     // 外放经历次数
  flags:{},
  log:[],
  over:false,
  endReason:''
};

const OFFICES=[
  {lv:0,name:'白身',rank:'—'},
  {lv:1,name:'知县',rank:'正七品',path:'外'},
  {lv:2,name:'推官',rank:'正七品',path:'外'},
  {lv:3,name:'给事中',rank:'正七品',path:'京'},
  {lv:4,name:'主事',rank:'正六品',path:'京'},
  {lv:5,name:'知府',rank:'从四品',path:'外'},
  {lv:6,name:'参政',rank:'从三品',path:'外'},
  {lv:7,name:'按察使',rank:'正三品',path:'外'},
  {lv:8,name:'布政使',rank:'从二品',path:'外'},
  {lv:9,name:'侍郎',rank:'正三品',path:'京'},
  {lv:10,name:'尚书',rank:'正二品',path:'京'},
  {lv:11,name:'内阁大学士',rank:'正五品兼尚书衔',path:'京'}
];

const SEASONS=['春','夏','秋','冬'];
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const chance=p=>Math.random()<p;

function dateOf(t){
  // 第1回合=嘉靖二十五年春
  const y=1546+Math.floor((t-1)/4);
  return {year:y,season:SEASONS[(t-1)%4],era:`嘉靖${y-1521}年`};
}
function currentDate(){return dateOf(G.turn);}
function officeName(){return G.office?`${G.office.name}（${G.office.rank}）`:G.examTitle;}
function addLog(text){
  const d=currentDate();
  G.log.push({era:d.era,season:d.season,text});
  renderLog();
}
function renderHUD(){
  const f=v=>v>0?`<b class="g">+${v}</b>`:v<0?`<b class="r">${v}</b>`:'0';
  const d=currentDate();
  $('hud').innerHTML=`
    <span>第<b>${G.turn}</b>回合</span>
    <span>${d.era}<b>${d.season}</b></span>
    <span>文<b>${G.文才}</b></span>
    <span>谋<b>${G.谋略}</b></span>
    <span>交<b>${G.交际}</b></span>
    <span>体<b>${G.体质}</b></span>
    <span>运<b>${G.运气}</b></span>
    <span>政<b>${G.政绩}</b></span>
    <span>银<b>${G.银钱}</b></span>
    <span>脉<b>${G.人脉}</b></span>
    <span>严${f(G.严党)}</span>
    <span>徐${f(G.徐党)}</span>
    <span>清${f(G.清流)}</span>`;
}
function renderLog(){
  const el=$('logList');if(!el)return;
  if(!G.log.length){el.innerHTML='<div class="log-item" style="opacity:.5">尚无记事</div>';return;}
  el.innerHTML=G.log.slice(-40).reverse().map(l=>
    `<div class="log-item"><span class="ly">${l.era}${l.season}</span>${l.text}</div>`).join('');
}
function renderScene(sc){
  const d=currentDate();
  let html=`<div class="date-bar"><span>第${G.turn}回合 · ${d.era} · ${d.season}</span><span class="office">${officeName()}</span></div>`;
  html+=`<div class="scene-title">${sc.title}</div>`;
  const text=typeof sc.text==='function'?sc.text():sc.text;
  html+=`<div class="text">${text}</div>`;
  const opts=typeof sc.options==='function'?sc.options():sc.options;
  if(opts&&opts.length){
    html+=`<div class="options">`;
    opts.forEach((o,i)=>{
      const tag=o.tag?`<span class="tag ${o.tagClass||'t-wen'}">${o.tag}</span>`:'';
      const sub=o.sub?`<span class="sub">${o.sub}</span>`:'';
      html+=`<button class="opt" data-i="${i}">${tag}${o.label}${sub}</button>`;
    });
    html+=`</div>`;
  }
  const story=$('story');
  story.className='story fade';
  story.innerHTML=html;
  if(opts){
    story.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        const o=opts[+btn.dataset.i];
        if(o.effect)o.effect();
        renderHUD();
        if(G.over)return;
        // 推进回合
        if(o.next!==undefined)G.turn=o.next;
        else G.turn++;
        renderHUD();
        nextScene();
      };
    });
  }
  renderHUD();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   主循环
   ============================================================ */
function nextScene(){
  if(G.over)return;
  if(G.turn>30){return endGame('正常终局');}
  const sc=SCENES[G.turn];
  if(sc)return renderScene(sc);
  // 未定义的回合：按文档的"丝滑回流"机制，强制回到主线
  return renderGenericReturn();
}

function renderGenericReturn(){
  const d=currentDate();
  renderScene({
    title:`${d.era} · ${d.season} · 主线回流`,
    text:`<p>吏部考满文册到，同年密信至，京中科道缺员的消息传来。</p>
          <p class="dim">支线回归主线，你必须继续面对官场升迁。</p>`,
    options:[
      {label:'继续',tag:'主线',tagClass:'t-wen',sub:'进入下一回合',
       effect:()=>{addLog('主线回流。');}}
    ]
  });
}

/* ============================================================
   考满系统 —— 严格按文档"德才功赃"
   ============================================================ */
function doKaoman(cb){
  const luck=G.运气,wc=G.文才,zj=G.政绩;
  // 基础概率（文档公式）
  let pDe=Math.max(2,20+(luck-50)*0.30);
  let pCai=Math.max(5,35+(wc-50)*0.20);
  let pGong=Math.max(5,30+(zj-50)*0.20);
  let pZang=Math.max(5,15-(luck-50)*0.20);
  // 党争修正
  pDe += Math.max(0,G.清流)*0.8;
  pCai += Math.max(0,G.徐党)*0.6 + Math.max(0,G.严党)*0.5;
  pGong += Math.max(0,G.严党)*0.6 + Math.max(0,G.徐党)*0.4;
  pZang += Math.max(0,-G.清流)*0.8 + (G.flags.贪墨?10:0);
  if(G.office&&G.office.lv>=5)pZang+=4;
  if(G.office&&G.office.lv>=7)pZang+=5;
  const total=pDe+pCai+pGong+pZang;
  let roll=Math.random()*total,face;
  if(roll<pDe)face='德';
  else if(roll<pDe+pCai)face='才';
  else if(roll<pDe+pCai+pGong)face='功';
  else face='赃';

  G.km[face]++;
  const FACES={
    '德':{cls:'f-de',v:'操守清廉，政绩卓异 —— 越级晋升'},
    '才':{cls:'f-cai',v:'才力优长 —— 正常晋升一级'},
    '功':{cls:'f-gong',v:'任内劳绩可纪 —— 正常晋升，可优先选缺'},
    '赃':{cls:'f-zang',v:'贪酷、浮躁、不谨 —— 降职或调用'}
  };
  const oldLv=G.office?G.office.lv:0;
  let newLv=oldLv,resultText='';
  if(face==='德'){newLv=Math.min(oldLv+2,11);G.清流+=2;G.政绩+=3;resultText='越级晋升。';}
  else if(face==='才'){newLv=Math.min(oldLv+1,11);G.文才+=2;resultText='正常晋升一级。';}
  else if(face==='功'){newLv=Math.min(oldLv+1,11);G.政绩+=2;resultText='正常晋升，可优先选缺。';}
  else{newLv=Math.max(1,oldLv-1);G.清流-=3;resultText='降职调用。';}

  const oldName=G.office?G.office.name:'—';
  if(newLv>0){
    const no=OFFICES.find(o=>o.lv===newLv)||OFFICES[1];
    G.office={lv:newLv,name:no.name,rank:no.rank,path:no.path||'外'};
    if(no.path==='外')G.outerPostCount++;
  }
  G.officeStartTurn=G.turn;
  addLog(`考满：${face}面。${oldName}→${G.office?G.office.name:'白身'}`);

  const updown=newLv>oldLv?`<span style="color:var(--green)">晋升 ${newLv-oldLv} 级</span>`:newLv<oldLv?`<span style="color:var(--red)">降职</span>`:`<span style="color:var(--ink2)">留任</span>`;
  renderScene({
    title:'考满 · 铨选迁转',
    text:`<p>三年一考，吏部考功司将你的履历呈上。堂官闭门会议，司礼监秉笔太监在侧监看。</p>
    <div class="dialogue"><span class="speaker">考功司堂官</span><span class="line">凡升必满考。考满等第，决定升迁幅度。</span></div>
    <p>你屏息等待。掣签之声，骰落而定。</p>
    <div class="roll-box"><div class="face ${FACES[face].cls}">${face}</div><div class="verdict">${FACES[face].v}</div></div>
    <p>${resultText}</p>
    <p>原任：<b>${oldName}</b> → 新职：<b class="hl">${G.office?G.office.name:'白身'}</b>${G.office?'（'+G.office.rank+'）':''}　${updown}</p>`,
    options:[{label:'谢恩赴任',next:G.turn+1,effect:()=>{if(cb)cb();}}]
  });
}

/* ============================================================
   结局系统 —— 严格按文档结局表
   ============================================================ */
function endGame(reason){
  if(G.over)return;G.over=true;G.endReason=reason;
  const lv=G.office?G.office.lv:0;
  const km=G.km;const totalKM=km.德+km.才+km.功+km.赃;
  // 严党线最高值
  const maxFaction=Math.max(G.严党,G.徐党,G.清流);

  /* ===== 提前结局（优先判定） ===== */
  if(G.flags.革功名){return renderEnding('终身秀才',
    `<p>乡试舞弊被查出，革除功名。你终身未能入仕。</p>
     <p>父亲陆廷玉因此事受牵连，被降职调用。陆家从此一蹶不振。</p>
     <p class="dim">——你以秀才之身终老，再无翻身之日。</p>`,
    '乡试舞弊被查出，革除功名。',km,totalKM,G);}

  if(G.flags.战死){return renderEnding('战死沙场',
    `<p>庚戌之变中，你组织民壮北上勤王。混战之中，你身中数箭，倒在血泊里。</p>
     <p>朝廷追赠你为光禄寺少卿，荫一子入国子监。但这一切，你都看不到了。</p>
     <p class="dim">——你以忠烈之名，载入《明史·忠义传》。</p>`,
    '庚戌之变中战死。',km,totalKM,G);}

  if(G.flags.下狱处死){return renderEnding('下狱处死',
    `<p>杨继盛案牵连，你被下诏狱。严党欲置你于死地，最终以"交结朋党"论罪，处斩。</p>
     <p>临刑前，你想起嘉靖二十五年那个春天，父亲从工部回来，说起主考官的样子。</p>
     <p class="dim">——你的名字，与杨继盛一起，被后人记住。</p>`,
    '杨继盛案牵连，下狱处死。',km,totalKM,G);}

  if(G.flags.满门抄斩){return renderEnding('满门抄斩',
    `<p>严世蕃案牵连，你因深度依附严党、告密杨继盛同党，被列入逆案。</p>
     <p>陆家满门抄斩，父亲陆廷玉亦未能幸免。</p>
     <p class="dim">——站错队的代价，是全家的性命。</p>`,
    '严党清算，满门抄斩。',km,totalKM,G);}

  /* ===== 正式结局 ===== */
  let endingName,endingDesc,endingSum;

  // 位极人臣：徐党≥8，严党≤3，政绩≥60，京察无赃
  if(G.徐党>=8 && G.严党<=3 && G.政绩>=60 && km.赃===0){
    endingName='位极人臣';
    endingDesc=`<p>嘉靖四十五年冬，世宗驾崩。徐阶草拟遗诏，裕王继位。</p>
      <p>你以入阁为大学士，加太师或太傅衔，位列三公，权倾天下。</p>
      <p>你主持朝政，革除严嵩弊政，起用被贬清流，一时朝野称颂。</p>
      <p class="dim">——你的一生，从宛平秀才到内阁首辅，走完了嘉靖朝最完整的一条上升之路。</p>`;
    endingSum=`<b>结局：位极人臣</b><br>
      入阁为大学士，加太师衔。徐党${G.徐党}，严党${G.严党}，政绩${G.政绩}，京察无赃。<br>

function renderEnding(name,desc,sum,km,totalKM,G){
  const lv=G.office?G.office.lv:0;
  let html=`<div class="ending"><div class="mark">终</div><h1>${name}</h1>
    <div class="desc">${desc}</div>
    <div class="summary">${sum}<br><br>
      <b>考满记录：</b>德${km.德} 才${km.才} 功${km.功} 赃${km.赃}（共${totalKM}次）<br>
      <b>朝中关系：</b>严党 ${G.严党}　徐党 ${G.徐党}　清流 ${G.清流}<br>
      <b>最终官职：</b>${G.office?G.office.name+'（'+G.office.rank+'）':'白身'}<br>
      <b>外放经历：</b>${G.outerPostCount} 任　<b>最终政绩：</b>${G.政绩}　<b>银钱：</b>${G.银钱}两
    </div>
    <div class="stats">
      <span>最终官职<b>${G.office?G.office.name:'白身'}</b></span>
      <span>考满德面<b>${km.德}次</b></span>
      <span>考满赃面<b>${km.赃}次</b></span>
    </div>
    <button class="btn-restart" onclick="location.reload()">重 开 一 局</button></div>`;
  const story=$('story');story.className='story fade';story.innerHTML=html;
}
